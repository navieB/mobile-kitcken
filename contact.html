<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONTACT</title>
    <link rel="icon" type="image/x-icon" href="assets/images/logo.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="navbar">
        <div class="top-bar">
            <div class="brand">
                <img src="assets/images/logo.png" alt="logo" class="logo" height="90px" width="90px">
                <h2 class="logo">Mobile Kitchen</h2>
            </div>

            <div class="nav-links">
                <nav>
                    <ul>
                        <li><a href="index.html">Home</a></li>
                        <li><a href="products.html">Products</a></li>
                        <li><a href="about.html">About Us</a></li>
                        <li><a href="enquiry.html">Enquire</a></li>
                    </ul>
                </nav>
            </div>

        </div>
    </header>
    
    <main class="contact-main">
        <section class="contact-hero">
            <h1>Contact Us</h1><br>
            <br>
        </section>

        <section class="contact-container">
                <div class="contact-form">
                    <form>
                        <input type="text" placeholder="Your Name" required>

                        <input type="email" placeholder="Your Email" required>

                        <textarea row="6" placeholder="Your Message" required></textarea>
                        <button type="submit">Submit</button>
                    </form>
                    
                    <div class="contact-image">
                        <img src="assets/images/Contact-Us.jpg" alt="contact">
                </div>
                </div>
        </section>
    </main>

    <footer>
        <div class="footer-content">
        <p>2026 Studio. Mobile kitchen. All Rights Reserved. Built Navela.B</p>
        </div>
    </footer>
</body>
</html>
